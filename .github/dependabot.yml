#
# Weekly version-update PRs for the pinned GitHub Actions and the installer's
# npm dependencies (root package.json). Security alerts and security-update PRs are enabled
# separately in Settings -> Code security. The cooldown holds back a version
# for 7 days after it is published, so a malicious or broken release is more
# likely to be caught and yanked before a PR proposes it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Keep the Node type definitions on the oldest Node major the installer
      # supports (engines in package.json), so editors don't offer APIs that
      # are missing there. Raise together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

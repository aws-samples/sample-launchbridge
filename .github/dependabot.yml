#
# Weekly version-update PRs for the pinned GitHub Actions and the installer's
# npm dependencies. Security alerts and security-update PRs are enabled
# separately in Settings -> Code security. The cooldown holds back a version
# for 7 days after it is published, so a malicious or broken release is more
# likely to be caught and yanked before a PR proposes it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /install_script
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

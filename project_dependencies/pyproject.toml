[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launchbridge"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # Core dependencies used by all modules
    "pydantic>=2.0.0",
    # Provides uvx binary used by MCP servers as fallback
    "uv>=0.5.0",
    # MCP servers — pre-installed to avoid cold-start timeout when launched via uvx
    "awslabs-aws-documentation-mcp-server",
]

[project.optional-dependencies]
testing-skill = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
]
indexing_and_qa = [
    # Pinned to a commit on main (iris publishes no tags). To update it, change the
    # ref to @main, run install_script/freeze_deps.py project_dependencies, review
    # the diff, and commit.
    "iris @ git+https://github.com/aws-samples/sample-indexed-repository-intelligence-system.git@c2f9b595670db01dd9d4fcb3d774f2dbd784983f",
    "requests>=2.32.0",
]

eval_toolkit = [
    # Core — used by most metrics (accuracy, precision, recall, f1, match, MAE, MSE, RMSE, registry, data types)
    "numpy>=2.1,<3",
    # LLM-as-judge metrics — BedrockClient (bedrock_client.py)
    "boto3>=1.34",
    # Hungarian algorithm — comparison_functions.py (match metric)
    "munkres>=1.1,<2",
]

eval_toolkit_media = [
    # Image data type — image_data.py
    "pillow>=10",
    # Video data type — video_data.py. <5.1: opencv-python 5.1.0.95 ships
    # Windows wheels only (no macOS or Linux wheels, no sdist), so pip can't
    # install it there. Lift the cap once a 5.1 release has wheels for all three.
    "opencv-python>=4.8,<5.1",
    # Audio data type — audio_data.py
    "soundfile>=0.12",
]

config_prompt_registry = [
    "PyYAML>=6.0",
]

dev = [
    "pytest>=8.0.0",
]

default = [
    "launchbridge[eval_toolkit,config_prompt_registry,testing-skill,dev,indexing_and_qa]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
